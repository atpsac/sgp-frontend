<header class="topbar shadow-sm">
  <div class="container-fluid d-flex align-items-center gap-2">
    <a
      class="brand d-inline-flex align-items-center text-white text-decoration-none"
      [routerLink]="['/dashboard']"
    >
      <img
        src="assets/home/logo_original.png"
        alt="logo"
        class="brand-logo me-2"
      />
    </a>

    <button
      class="btn btn-link btn-icon"
      type="button"
      (click)="onToggleSidebar()"
      aria-label="Toggle menu"
    >
      <span class="material-symbols-rounded">menu</span>
    </button>

    <div class="ms-auto d-flex align-items-center gap-2">
      <div class="userbox" [class.open]="userMenuOpen">
        <button
          class="user-btn"
          type="button"
          (click)="toggleUserMenu($event)"
          aria-haspopup="menu"
          [attr.aria-expanded]="userMenuOpen"
        >
          <span class="avatar-initials">
            {{ userInitials }}
          </span>

          <div class="user-mini d-none d-md-flex flex-column align-items-start">
            <strong>{{ userName }}</strong>
            <small>{{ userEmail }}</small>
          </div>

          <span class="material-symbols-rounded">more_vert</span>
        </button>

        <div
          class="dropdown-menu dropdown-menu-end user-dd p-0"
          [class.show]="userMenuOpen"
        >
          <div class="user-dd-head d-flex align-items-center justify-content-between p-3">
            <div class="d-flex align-items-center gap-2">
              <span class="avatar avatar-initials avatar-initials--lg">
                {{ userInitials }}
              </span>

              <div class="user-dd-info">
                <strong>{{ userName }}</strong>
                <small>{{ userEmail }}</small>
              </div>
            </div>

            <span class="material-symbols-rounded text-white-50">account_circle</span>
          </div>

          <ul class="list-unstyled m-0">
            <li>
              <a class="dropdown-item" href="javascript:void(0)">
                <span class="material-symbols-rounded">mail</span>
                {{ userEmail }}
              </a>
            </li>

            <li>
              <hr class="dropdown-divider" />
            </li>

            <li>
              <a class="dropdown-item" href="javascript:void(0)" (click)="logout()">
                <span class="material-symbols-rounded">logout</span>
                Cerrar Sesión
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</header>
