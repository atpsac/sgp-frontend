<div class="modal-content reactivate-modal">
  <div class="reactivate-modal__head">
    <div class="reactivate-modal__icon">
      <span class="material-symbols-rounded">restart_alt</span>
    </div>

    <div>
      <h5 class="reactivate-modal__title mb-1">
        Reactivar transportista
      </h5>
      <p class="reactivate-modal__subtitle mb-0">
        Esta acción volverá a habilitar el registro seleccionado.
      </p>
    </div>

    <button
      type="button"
      class="btn-close ms-auto"
      aria-label="Cerrar"
      (click)="close()"
      [disabled]="isReactivating"
    ></button>
  </div>

  <div class="reactivate-modal__body">
    <p class="reactivate-modal__question">
      ¿Estás seguro de reactivar este transportista?
    </p>

    <div class="reactivate-modal__info">
      <div>
        <span>Razón social</span>
        <strong>{{ companyName }}</strong>
      </div>

      <div>
        <span>RUC</span>
        <strong>{{ ruc }}</strong>
      </div>

      <div>
        <span>Código</span>
        <strong>{{ code }}</strong>
      </div>
    </div>

    <div class="reactivate-modal__notice">
      <span class="material-symbols-rounded">check_circle</span>
      <p>
        El transportista volverá a estar disponible para nuevas operaciones.
      </p>
    </div>
  </div>

  <div class="reactivate-modal__footer">
    <button
      type="button"
      class="btn ux-btn ux-btn--light"
      (click)="close()"
      [disabled]="isReactivating"
    >
      Cancelar
    </button>

    <button
      type="button"
      class="btn ux-btn ux-btn--success"
      (click)="reactivate()"
      [disabled]="isReactivating"
    >
      <span
        *ngIf="isReactivating"
        class="spinner-border spinner-border-sm me-2"
      ></span>
      Reactivar
    </button>
  </div>
</div>
